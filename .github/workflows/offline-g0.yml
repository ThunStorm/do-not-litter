name: Offline G0 gates
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.21.0'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      # Dependency downloads only during installation. No business secrets or data.
      - run: |
          python -m pip install -r backend/requirements-ci.txt
          python -m pip install --no-deps -e backend
          pnpm install --frozen-lockfile
      - run: python scripts/check_g0.py --output-dir test-results/g0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-g0-evidence
          path: test-results/g0
