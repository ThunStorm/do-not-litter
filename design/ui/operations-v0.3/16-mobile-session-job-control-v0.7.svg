<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><style>.p{fill:#fbfaf7;stroke:#d8d3ca}.s{fill:#f7f5f0;stroke:#d8d3ca}.i{fill:#1d1b18}.m{fill:#77726a}.r{fill:#b52b1d}.g{fill:#59863f}.a{fill:#a66c15}.serif{font-family:Songti SC,STSong,serif}.sans{font-family:PingFang SC,Microsoft YaHei,sans-serif}.h{font:600 20px Songti SC,STSong,serif}.b{font:13px PingFang SC,Microsoft YaHei,sans-serif}.q{font:11px PingFang SC,Microsoft YaHei,sans-serif}</style><rect width="1280" height="720" fill="#f4f1eb"/><text x="44" y="55" class="h i">移动端会话与任务控制</text><rect x="44" y="82" width="330" height="568" rx="14" class="p"/><text x="70" y="124" class="h i">手机刷新</text><rect x="70" y="148" width="278" height="88" rx="7" class="s"/><text x="88" y="180" class="b i">已建立可信会话</text><text x="88" y="204" class="q g">刷新后继续进入内容页</text><text x="88" y="222" class="q m">HttpOnly Cookie · 7 天</text><path d="M209 258v35" stroke="#77726a"/><path d="M204 285l5 8 5-8" fill="none" stroke="#77726a"/><rect x="70" y="305" width="278" height="104" rx="7" fill="#fcf8ef" stroke="#d8bf90"/><text x="88" y="337" class="b i">服务暂不可用</text><text x="88" y="361" class="q a">显示“重试连接”，不要求配对码</text><rect x="88" y="374" width="70" height="22" rx="4" fill="#b52b1d"/><text x="105" y="390" class="q" fill="white">重新连接</text><text x="70" y="456" class="q m">只有 401 / 403 才回到配对页</text><text x="70" y="485" class="q m">500 是服务诊断，不是配对失效</text><rect x="404" y="82" width="390" height="568" rx="8" class="p"/><text x="430" y="124" class="h i">FETCH_METADATA 诊断</text><text x="430" y="164" class="q m">03:30:57 · 请求 Bilibili 元数据</text><text x="430" y="192" class="q m">03:30:58 · 已解析 BV / CID</text><text x="430" y="220" class="q m">03:30:58 · 查询现有 VideoAsset</text><text x="430" y="248" class="q g">03:30:58 · 复用已存在资产</text><text x="430" y="276" class="q g">03:30:58 · 元数据写入完成</text><line x1="430" y1="298" x2="767" y2="298" stroke="#e8e3db"/><text x="430" y="334" class="q a">错误码：VIDEO_METADATA_FAILED</text><text x="430" y="360" class="q i">操作提示：检查链接与网络后重试</text><text x="430" y="400" class="q m">日志只记录 BV、CID、耗时与阶段</text><text x="430" y="425" class="q m">不记录 Cookie、Key 或请求正文</text><rect x="824" y="82" width="412" height="568" rx="8" class="p"/><text x="850" y="124" class="h i">取消与重试</text><rect x="850" y="150" width="360" height="64" rx="7" class="s"/><text x="870" y="179" class="b i">取消当前任务</text><text x="870" y="200" class="q m">标记取消，等待当前外部调用返回</text><path d="M1030 230v34" stroke="#77726a"/><path d="M1025 256l5 8 5-8" fill="none" stroke="#77726a"/><rect x="850" y="276" width="360" height="80" rx="7" fill="#fcf8ef" stroke="#d8bf90"/><text x="870" y="307" class="b i">正在停止当前阶段</text><text x="870" y="329" class="q a">重试暂不可用 · lease 仍被当前 Worker 持有</text><path d="M1030 372v34" stroke="#77726a"/><path d="M1025 398l5 8 5-8" fill="none" stroke="#77726a"/><rect x="850" y="418" width="360" height="98" rx="7" fill="#f2f6ed" stroke="#b7cda8"/><text x="870" y="450" class="b i">取消已确认</text><text x="870" y="473" class="q g">临时音频 / Cookie 已清理，lease 已释放</text><rect x="870" y="485" width="55" height="22" rx="4" fill="#b52b1d"/><text x="886" y="501" class="q" fill="white">重试</text></svg>
